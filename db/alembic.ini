# Alembic configuration (plan T7).
#
# Run from the repository root:
#     uv run alembic -c db/alembic.ini upgrade head
#     uv run alembic -c db/alembic.ini downgrade base
#
# **There is deliberately no `sqlalchemy.url` here.** The database URL is one
# variable with one reader: `app/core/config.py` (spec AC3). Putting a DSN in
# this file would be a second source of truth, it would be committed, and it
# would drift from `.env.example` the first time anyone changed a password.
# `migrations/env.py` asks `get_settings()` instead.

[alembic]
# `%(here)s` is the directory holding this file, so the paths below do not
# depend on the working directory alembic was launched from.
script_location = %(here)s/migrations

# The repository root, so `import app.core.config` resolves in env.py.
prepend_sys_path = %(here)s/..

# Split path lists on `os.pathsep` only. Without this line Alembic falls back to
# splitting on spaces, commas *and colons*: on Windows `%(here)s` starts with
# `C:`, and a checkout under a path with a space (`C:\Users\Jan de Vries\...`,
# any OneDrive folder) shatters into fragments, leaving the repository root off
# `sys.path` and env.py unable to import `app`. `package = false` in
# pyproject.toml means that entry is the only route to `app`.
# tests/meta/test_migration_scaffolding.py fails if this line goes.
path_separator = os

# Revisions are named NNNN_slug.py so a directory listing reads in order (plan
# "Data changes"). Alembic cannot invent the number, so pass it:
#     uv run alembic -c db/alembic.ini revision --rev-id 0002 -m "drinks"
file_template = %%(rev)s_%%(slug)s

# Deliberately no `timezone = ...` here. Alembic resolves that name through
# `zoneinfo`, which on Windows finds no tz database unless `tzdata` is
# installed -- so `timezone = UTC` made `revision` raise "Can't locate
# timezone: UTC" *before writing any file*, while `upgrade`/`downgrade` (which
# never stamp a date) kept working. `Create Date` is a docstring comment, not
# data: a naive local timestamp costs nothing, and a vendor package for a
# comment's format costs more. tests/meta/test_migration_scaffolding.py fails
# if this line comes back.

# --- logging -----------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
