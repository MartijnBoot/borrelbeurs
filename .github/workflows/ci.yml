# BorrelBeurs -- the gate, in CI (plan T11, AC4, AC5).
#
# One workflow, every PR and every push to `main` (way-of-working 7.3:1179).
# Three jobs: `check` runs the identical script a developer runs locally --
# scripts/check.sh is not restated here, it is called -- so AC4 ("local and
# CI agree") is structurally true rather than a promise someone has to keep.
# `secret-scan` and `image` are independent and run in parallel with it; `image-drill`
# and `venue` follow `image`, and `push` (main only) follows them all (Phase 8 PD10).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # gitleaks-action scans only the new commits on push and pull_request; it
  # scans the full history only on these two (plan:284).
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  # A merge must never cancel the push job of the run before it (Phase 8 PD10).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    # Same image + credentials as docker-compose.yml's `db` (AC1 keeps these
    # two in sync; tests/meta/test_compose_matches_env_example.py guards it).
    # DATABASE_URL below is .env.example's own value -- a published, local-only
    # development credential, not a secret.
    services:
      db:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: borrelbeurs
          POSTGRES_PASSWORD: borrelbeurs
          POSTGRES_DB: borrelbeurs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U borrelbeurs -d borrelbeurs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://borrelbeurs:borrelbeurs@localhost:5432/borrelbeurs
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      # No root package.json and no `packageManager` field, so the action has
      # nothing to read a version from -- it must be given one.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Python dependencies (frozen)
        run: uv sync --frozen

      - name: Install web dependencies (frozen)
        run: pnpm --dir web install --frozen-lockfile

      # The gate's e2e step (Phase 4 T23) drives Chromium; --with-deps adds the
      # system libraries the runner image lacks.
      - name: Install Playwright's Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium

      # AC2 (fail-fast boot) needs a JWT_SECRET at least 32 characters long,
      # and .env.example deliberately ships one too short to pass validation
      # (a committed one would be a leaked one). Generated fresh per run, the
      # same way scripts/setup.sh generates a local one.
      - name: Generate an ephemeral JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Run the gate
        run: ./scripts/check.sh

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the scheduled / manual runs can scan all of it --
          # a secret committed and later deleted still leaked.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned: .gitleaks.toml's `[[allowlists]]` table is ignored by
          # older gitleaks releases, and the action's default moves.
          GITLEAKS_VERSION: 8.28.0
          # No GITLEAKS_LICENSE: that is only required for a GitHub
          # organization's repositories, and this one is on a personal
          # account (Phase 0 plan T12, tag v2-rebuild-complete).

  # Phase 8 (PD10, SD6): the image is built once, here, checked, and handed on as an
  # artifact. The drills and the push use that artifact, never a rebuild.
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the image
        run: docker build -f docker/Dockerfile --build-arg BUILD_SHA=${{ github.sha }} -t borrelbeurs:ci .

      # AC2, AC3: no forbidden path, and the size line goes into the log.
      - name: Check the contents and size
        run: python scripts/ci/check_image.py borrelbeurs:ci --max-mb 300

      # AC4, SD20: fixable CRITICAL/HIGH fail the job; the SBOM is written either way.
      - name: Scan, and write the SBOM
        run: bash scripts/ci/scan_image.sh borrelbeurs:ci sbom.cdx.json

      - name: Upload the SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: ignore

      # AC7 (ADR 0006): what the image serves references nothing off-origin.
      - name: Check the built assets in the image
        run: |
          id="$(docker create borrelbeurs:ci)"
          docker cp "$id:/app/web/dist" "$RUNNER_TEMP/dist"
          docker rm "$id"
          python scripts/check_built_assets.py "$RUNNER_TEMP/dist"

      - name: Save the image
        run: docker save --output image.tar borrelbeurs:ci

      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 7

  # AC9, AC10, AC17, AC18 against the built image (tests/image).
  image-drill:
    name: image-drill
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Install Python dependencies (frozen)
        run: uv sync --frozen

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load the image
        run: docker load --input image.tar

      - name: Boot drill and kill drill
        run: uv run pytest tests/image/test_boot_image.py tests/image/test_kill_drill.py --image borrelbeurs:ci -v

  # AC19-AC24: the bundle, run as the venue laptop runs it. The laptop needs Docker's
  # containerd image store (start.cmd checks it): `docker load` on the classic store
  # drops the pinned Postgres digest. The runner is switched to it first.
  venue:
    name: venue
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Install Python dependencies (frozen)
        run: uv sync --frozen

      - name: Use Docker's containerd image store
        run: |
          echo '{"features": {"containerd-snapshotter": true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load the image
        run: docker load --input image.tar

      # CI=true: the drill removes both images and reloads them from the bundle's tar.
      - name: Venue drill
        run: uv run pytest tests/image/test_venue.py --image borrelbeurs:ci -v

  # Only a merge to `main`, and only once everything above is green (SD6). The image
  # pushed is the artifact that was tested. `latest` is never pushed.
  push:
    name: push
    needs: [check, secret-scan, image, image-drill, venue]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load the image
        run: docker load --input image.tar

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push by full SHA
        run: |
          docker tag borrelbeurs:ci "ghcr.io/martijnboot/borrelbeurs:${{ github.sha }}"
          docker push "ghcr.io/martijnboot/borrelbeurs:${{ github.sha }}"
