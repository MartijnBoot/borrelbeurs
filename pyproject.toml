# Project metadata and the entire Python toolchain, in one file (plan D6-D8).
#
# uv is the package manager and resolver (D6); uv.lock beside this file is the
# committed lockfile and every install is frozen (way-of-working 5.1:661).
# ruff is formatter and linter in one (D7); mypy is the type checker (D8).
#
# There is deliberately no [build-system] table and `package = false` below:
# this repository is an application, never a distributable. uv therefore
# installs the dependencies without trying to build `app/`, and pytest imports
# `app` from the repository root via `pythonpath` below.

[project]
name = "borrelbeurs"
version = "0.0.0"
description = "A drink stock exchange for student borrels."
requires-python = "==3.11.*"

dependencies = [
    # Web layer. ADR 0001, ADR 0002.
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    # Validated configuration. pydantic-settings is what turns the environment
    # from unvalidated strings into a schema that can fail at boot (AC2).
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # Persistence. docs/design/architecture.md:211, docs/design/data-model.md:3.
    # The `asyncio` extra is SQLAlchemy's own documented install target for the
    # async engine, and it is what pulls in greenlet. Without it
    # `sqlalchemy.ext.asyncio` refuses to import, which makes the async
    # Alembic env.py the plan mandates (T7) unimplementable. Same package, same
    # approval (plan:377) -- not a new vendor.
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2",
    # The pricing engine. Pinned exactly: Phase 1 replays v1's golden fixtures
    # and numpy's random stream is what they rest on (plan D2).
    "numpy==1.26.4",
    # Access keys and sessions (Phase 3 SD5, SD6, SD8; approved under plan PD1).
    # argon2id hashing of key secrets: stdlib has scrypt, not argon2.
    "argon2-cffi>=23.1,<26",
    # HS256 session tokens with `exp` validation: no JWT in stdlib, and
    # hand-rolled HMAC/base64url/claims is where auth bugs live.
    "PyJWT>=2.9,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "testcontainers>=4.8,<5",
    # FastAPI's TestClient imports it (Phase 3 SD33; approved under plan PD1).
    "httpx>=0.27,<1.0",
]

[tool.uv]
package = false

# --- format and lint (D7) ----------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
# legacy/ is v1, frozen. tests/engine/v1_reference/ is v1's engine, moved there
# byte-identical and hash-pinned (Phase 1 plan D2): formatting it would change it.
extend-exclude = ["legacy", "tests/engine/v1_reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `op` and `sa` are in every Alembic revision by convention -- the template
# writes them, --autogenerate emits calls on them, and a hand-written empty or
# data-only migration uses neither. Without this waiver a freshly generated
# revision fails `scripts/check.sh` step 2 before its author has typed a
# character. Scoped to the versions directory: db/migrations/env.py is ordinary
# code and keeps the full rule set.
"db/migrations/versions/*.py" = ["F401"]

# --- types (D8) --------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = "^(legacy|tests/engine/v1_reference)/"
# tests/ has no __init__.py, but tests/engine/golden/ is imported as
# `tests.engine.golden` (Phase 1 T1). Without this, mypy names that package
# `golden` by walking up to the first directory lacking an __init__.py, and
# then finds it a second time under its import name.
explicit_package_bases = true
# The pydantic mypy plugin is deliberately not enabled: it rewrites model
# __init__ signatures, which would make the `Settings()` call in
# app/core/config.py an error even though populating a BaseSettings from the
# environment is exactly what it is for.

# The v1 reference engine is untyped and may not be edited (Phase 1 plan D2,
# R7). Its importers -- the golden capture, later the differential tests -- see
# it as `Any` rather than mypy following into it.
[[tool.mypy.overrides]]
module = "tests.engine.v1_reference.*"
follow_imports = "skip"

# --- tests -------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
